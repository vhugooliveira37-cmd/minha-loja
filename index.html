<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BocaBella</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#fff;
}

/* TOPO */

.top-bar{
    background:#111;
    color:#fff;
    text-align:center;
    padding:10px;
    font-size:14px;
    font-weight:500;
}

/* HEADER */

.header-container{
    max-width:1400px;
    margin:auto;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:42px;
    font-weight:700;
    color:#111;
}

.search-box{
    width:45%;
    display:flex;
}

.search-box input{
    width:100%;
    height:48px;
    border:1px solid #ddd;
    padding:0 15px;
    outline:none;
}

.search-box button{
    width:60px;
    border:none;
    background:#111;
    color:#fff;
    cursor:pointer;
}

.icons{
    display:flex;
    gap:20px;
    font-size:22px;
    cursor:pointer;
}

/* MENU */

.menu{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:50px;
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
    height:60px;
}

.menu a{
    text-decoration:none;
    color:#111;
    font-size:14px;
    font-weight:600;
    transition:.3s;
}

.menu a:hover{
    color:#a30000;
}

.exclusive{
    color:#a30000 !important;
}

.offers{
    background:#a30000;
    color:white !important;
    padding:20px 25px;
    height:100%;
    display:flex;
    align-items:center;
}

/* BANNER */

.hero-slider{
    position:relative;
    width:100%;
    height:550px;
    overflow:hidden;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    opacity:0;
    transition:opacity .8s ease;
}

.slide.active{
    opacity:1;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* RESPONSIVO */

@media(max-width:900px){

.header-container{
    flex-direction:column;
    gap:15px;
}

.search-box{
    width:100%;
}

.menu{
    flex-wrap:wrap;
    gap:20px;
    height:auto;
    padding:15px;
}

.hero-slider{
    height:300px;
}

.logo{
    font-size:34px;
}

}

</style>
</head>

<body>

<div class="top-bar">
    <span id="topMessage">
        🚚 Frete grátis acima de R$199
    </span>
</div>

<header>

<div class="header-container">

    <div class="logo">
        BocaBella
    </div>

    <div class="search-box">
        <input type="text" placeholder="O que você procura?">
        <button>🔍</button>
    </div>

    <div class="icons">
        <span>👤</span>
        <span>♡</span>
        <span>👜</span>
    </div>

</div>

<nav class="menu">

    <a href="#">MAQUIAGEM</a>

    <a href="#">PERFUMES</a>

    <a href="#">SKINCARE</a>

    <a href="#">CABELOS</a>

    <a href="#" class="exclusive">
        SÓ NA BOCABELLA
    </a>

    <a href="#" class="offers">
        OFERTAS
    </a>

</nav>

</header>

<section class="hero-slider">

    <div class="slide active">
        <img src="imagens/banner1.jpg" alt="">
    </div>

    <div class="slide">
        <img src="imagens/banner2.jpg" alt="">
    </div>

    <div class="slide">
        <img src="imagens/banner3.jpg" alt="">
    </div>

</section>

<script>

/* TOPO ROTATIVO */

const messages = [
    "🚚 Frete grátis acima de R$199",
    "🎁 Ganhe brindes exclusivos",
    "💄 Até 50% OFF em maquiagem"
];

let messageIndex = 0;

setInterval(() => {

    messageIndex++;

    if(messageIndex >= messages.length){
        messageIndex = 0;
    }

    document.getElementById("topMessage").innerText =
    messages[messageIndex];

},4000);

/* BANNERS */

const slides =
document.querySelectorAll(".slide");

let currentSlide = 0;

setInterval(() => {

    slides[currentSlide]
    .classList.remove("active");

    currentSlide++;

    if(currentSlide >= slides.length){
        currentSlide = 0;
    }

    slides[currentSlide]
    .classList.add("active");

},5000);

</script>

</body>
</html>
