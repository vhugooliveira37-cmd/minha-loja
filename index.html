<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Helvetica', sans-serif; margin: 0; background-color: #fdf6f5; color: #5a4a4a; }
        .container { max-width: 1200px; margin: auto; padding: 0 20px; }

        /* Cabeçalho */
        header { background: #fff; padding: 20px 0; border-bottom: 1px solid #f0e0e0; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .logo { font-size: 28px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        .search-box input { width: 500px; padding: 10px; border: 1px solid #e0d0d0; border-radius: 4px; }
        .icons { display: flex; gap: 20px; font-size: 20px; }
        nav { display: flex; justify-content: center; gap: 30px; margin-top: 10px; }
        nav a { text-decoration: none; color: #5a4a4a; font-size: 13px; font-weight: bold; text-transform: uppercase; }

        /* Banners e Estruturas */
        .banner-principal { width: 100%; height: 350px; background: #ece0e0; margin: 20px 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        
        /* 4 Banners de categoria conforme Imagem 3 */
        .mosaico-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin: 40px 0; }
        .mosaico-banner { height: 200px; background: #e5c9c9; border-radius: 8px; }

        /* Seções de Destaque */
        .secao-destaque { display: flex; gap: 30px; margin: 40px 0; align-items: center; }
        .banner-lateral { width: 300px; height: 400px; background: #e5c9c9; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .lista-produtos { display: flex; gap: 20px; flex: 1; }
        .produto-card { background: white; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #f0e0e0; height: 250px; width: 200px; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="top-bar">
                <div class="logo">BOCABELLA</div>
                <div class="search-box"><input type="text" placeholder="O que você procura?"></div>
                <div class="icons"><span>👤</span> <span>🤍</span> <span>🛍️</span></div>
            </div>
            <nav>
                <a href="#">Cabelos</a><a href="#">Perfumes</a><a href="#">Skincare</a>
                <a href="#">Cuidados Pessoais</a><a href="#">Maquiagem</a><a href="#">Outlet</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <!-- 1. Início: Banner Rotativo -->
        <div class="banner-principal">Banner Rotativo</div>

        <!-- 2. "Os Favoritos Asiáticos" e produtos -->
        <h3>Os Favoritos Asiáticos</h3>
        <div class="lista-produtos">
            <div class="produto-card">Produto 1</div>
            <div class="produto-card">Produto 2</div>
            <div class="produto-card">Produto 3</div>
            <div class="produto-card">Produto 4</div>
        </div>

        <!-- 3. 4 Banners de categoria -->
        <div class="mosaico-grid">
            <div class="mosaico-banner">Banner 1</div>
            <div class="mosaico-banner">Banner 2</div>
            <div class="mosaico-banner">Banner 3</div>
            <div class="mosaico-banner">Banner 4</div>
        </div>

        <!-- 4. Continuação (Carolina Herrera 212) -->
        <h3>Conheça Carolina Herrera 212</h3>
        <div class="secao-destaque">
            <div class="banner-lateral">Imagem Lateral</div>
            <div class="lista-produtos">
                <div class="produto-card">Prod 1</div>
                <div class="produto-card">Prod 2</div>
                <div class="produto-card">Prod 3</div>
            </div>
        </div>
    </div>

</body>
</html>
