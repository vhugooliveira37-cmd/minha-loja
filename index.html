<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BocaBella</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fff;
}

/* TOPO */

.top-bar{
background:#111;
height:42px;
}

/* HEADER */

.header-container{
max-width:1400px;
margin:auto;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:42px;
font-weight:700;
color:#111;
cursor:pointer;
}

.search-box{
width:50%;
position:relative;
}

.search-box input{
width:100%;
height:52px;
border:none;
background:#f3f3f3;
border-radius:999px;
padding:0 55px 0 20px;
font-size:15px;
outline:none;
}

.search-box button{
position:absolute;
right:5px;
top:50%;
transform:translateY(-50%);
width:42px;
height:42px;
border:none;
border-radius:50%;
background:transparent;
cursor:pointer;
font-size:18px;
}

/* ICONES */

.icons{
display:flex;
gap:25px;
}

.icon-item{
position:relative;
font-size:22px;
cursor:pointer;
}

.tooltip{
position:absolute;
top:38px;
right:0;
background:#fff;
color:#111;
min-width:180px;
padding:12px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,.12);
opacity:0;
visibility:hidden;
transition:.25s;
z-index:999;
}

.tooltip small{
color:#777;
}

.icon-item:hover .tooltip{
opacity:1;
visibility:visible;
transform:translateY(5px);
}

/* MENU */

.menu{
display:flex;
justify-content:center;
align-items:center;
gap:50px;
border-top:1px solid #eee;
border-bottom:1px solid #eee;
height:60px;
}

.menu a{
text-decoration:none;
color:#111;
font-size:14px;
font-weight:600;
transition:.3s;
}

.menu a:hover{
color:#a30000;
}

.exclusive{
color:#a30000 !important;
}

.offers{
background:#a30000;
color:#fff !important;
padding:20px 25px;
height:100%;
display:flex;
align-items:center;
}

/* BANNER */

.hero-slider{
position:relative;
width:100%;
height:550px;
overflow:hidden;
}

.slide{
position:absolute;
inset:0;
opacity:0;
transition:opacity 1s ease;
}

.slide.active{
opacity:1;
z-index:2;
}

.slide img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}
@media(max-width:900px){

.header-container{
flex-direction:column;
gap:15px;
}

.search-box{
width:100%;
}

.menu{
flex-wrap:wrap;
gap:20px;
height:auto;
padding:15px;
}

.hero-slider{
height:320px;
}

.logo{
font-size:34px;
}

}

</style>
</head>

<body>

<div class="top-bar"></div>

<header>

<div class="header-container">

<div class="logo">
BocaBella
</div>

<div class="search-box">
<input type="text" placeholder="O que você procura?">

<button>
<i class="fa-solid fa-magnifying-glass"></i>
</button>

</div>

<div class="icons">

<div class="icon-item">

<i class="fa-regular fa-user"></i>

<div class="tooltip">
Minha Conta<br>
<small>Entrar ou cadastrar</small>
</div>

</div>

<div class="icon-item">

<i class="fa-regular fa-heart"></i>

<div class="tooltip">
Favoritos<br>
<small>Produtos salvos</small>
</div>

</div>

<div class="icon-item">

<i class="fa-solid fa-bag-shopping"></i>

<div class="tooltip">
Carrinho<br>
<small>Ver compras</small>
</div>

</div>

</div>

</div>

<nav class="menu">

<a href="#">MAQUIAGEM</a>

<a href="#">PERFUMES</a>

<a href="#">SKINCARE</a>

<a href="#">CABELOS</a>

<a href="#" class="exclusive">
SÓ NA BOCABELLA
</a>

<a href="#" class="offers">
OFERTAS
</a>

</nav>

</header>

<section class="hero-slider">

<div class="slide active">
<img src="imagens/banner1.jpg" alt="Banner 1">
</div>

<div class="slide">
<img src="imagens/banner2.jpg" alt="Banner 2">
</div>

<div class="slide">
<img src="imagens/banner3.jpg" alt="Banner 3">
</div>

</section>

<script>

const slides =
document.querySelectorAll(".slide");

let currentSlide = 0;

function nextSlide(){

slides[currentSlide]
.classList.remove("active");

currentSlide++;

if(currentSlide >= slides.length){
currentSlide = 0;
}

slides[currentSlide]
.classList.add("active");

}

setInterval(nextSlide,5000);

</script>

</body>
</html>
