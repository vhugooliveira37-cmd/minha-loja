<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Helvetica', sans-serif; margin: 0; background-color: #fcf9f7; color: #333; }
        
        /* Cabeçalho */
        header { background: #fff; padding: 20px 40px; border-bottom: 1px solid #eee; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        
        /* Logo estilo Sephora */
        .logo { font-size: 32px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: #000; }
        
        /* Busca e Ícones */
        .search-box { flex: 1; margin: 0 40px; }
        .search-box input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .icons { display: flex; gap: 20px; font-size: 20px; }
        
        /* Menu Navegação */
        nav { display: flex; justify-content: center; gap: 30px; padding: 10px; background: #fff; border-bottom: 1px solid #eee; }
        nav a { text-decoration: none; color: #4a4a4a; font-size: 14px; font-weight: 600; text-transform: uppercase; }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="logo">BocaBella</div>
            
            <div class="search-box">
                <input type="text" placeholder="O que você procura?">
            </div>

            <div class="icons">
                <span>👤</span> <!-- Login -->
                <span>🤍</span> <!-- Favoritos -->
                <span>🛍️</span> <!-- Sacola -->
            </div>
        </div>

        <nav>
            <a href="#">Cabelos</a>
            <a href="#">Perfumes</a>
            <a href="#">Skincare</a>
            <a href="#">Cuidados Pessoais</a>
            <a href="#">Maquiagem</a>
            <a href="#">Outlet</a>
        </nav>
    </header>

</body>
</html>
